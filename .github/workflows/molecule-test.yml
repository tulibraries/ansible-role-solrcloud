name: Molecule Test

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIPENV_VENV_IN_PROJECT: true
      ANSIBLE_ALLOW_BROKEN_CONDITIONALS: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Install pipenv
        run: python -m pip install pipenv

      - name: Install dependencies
        run: pipenv sync --dev

      - name: Set up vault password
        run: |
          rm -f "$RUNNER_TEMP/.vault"
          echo "::add-mask::${{ secrets.ANSIBLE_VAULT_PASSWORD }}"
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" | tr -d '\r\n' > "$RUNNER_TEMP/.vault"
          chmod 600 "$RUNNER_TEMP/.vault"
      
      - name: Run Molecule tests
        run: | 
          export ANSIBLE_VAULT_PASSWORD_FILE="$RUNNER_TEMP/.vault"
          pipenv run molecule test
